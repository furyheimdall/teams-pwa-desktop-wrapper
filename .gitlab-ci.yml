stages:
  - verify
  - package

default:
  image: oven/bun:1.3.14-debian@sha256:9dba1a1b43ce28c9d7931bfc4eb00feb63b0114720a0277a8f939ae4dfc9db6f
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .cache/bun/
      - .cache/electron/
      - .cache/electron-builder/
  before_script:
    - bun install --frozen-lockfile

variables:
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.cache/bun"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

verify:
  stage: verify
  script:
    - bun run verify

package:amd64:
  stage: package
  needs:
    - verify
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends fakeroot dpkg-dev
    - bun install --frozen-lockfile
  script:
    - bun run dist
  artifacts:
    name: "teams-pwa-desktop-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/Teams Desktop-*.AppImage
      - dist/teams-electron_*_amd64.deb
    expire_in: 7 days
