<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern color gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464EB8"/>
      <stop offset="100%" stop-color="#2D3280"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C60E7"/>
      <stop offset="100%" stop-color="#3B3E99"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23C2F2"/>
      <stop offset="100%" stop-color="#0E8CA8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Back Silhouette (Blue user) -->
  <g filter="url(#shadow)" opacity="0.9">
    <circle cx="345" cy="190" r="48" fill="url(#blueGrad)" />
    <path d="M 275 285 C 275 245, 305 245, 345 245 C 385 245, 415 245, 415 285 L 415 365 L 275 365 Z" fill="url(#blueGrad)" />
  </g>

  <!-- Middle Silhouette (Purple user) -->
  <g filter="url(#shadow)">
    <circle cx="245" cy="170" r="58" fill="url(#purpleGrad)" />
    <path d="M 160 275 C 160 225, 200 225, 245 225 C 290 225, 330 225, 330 275 L 330 375 L 160 375 Z" fill="url(#purpleGrad)" />
  </g>

  <!-- Foreground letter card -->
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="135" height="135" rx="24" fill="#4B4EB2" />
    <rect x="90" y="235" width="135" height="135" rx="24" fill="#FFFFFF" opacity="0.1" />
    <text x="157" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle">T</text>
  </g>
</svg>
